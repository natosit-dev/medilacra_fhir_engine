name: Unified Medilacra tests

on:
  push:
    branches: [main, feat/unified-medilacra, feat/m004-multiformat-eligibility]
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Engine and Workbench dependencies
        run: python -m pip install -r requirements-unified.txt
      - name: Engine source integrity and unified navigation tests
        run: python -m pytest -q tests
      - name: Workbench regression tests
        run: |
          cd apps/workbench
          python -m pytest -q tests
      - name: MVP-0 DTR version compatibility and reference regression
        run: |
          cd apps/mvp0
          python -m pytest -q \
            tests/test_shn_dtr_parameter_versions.py \
            tests/test_shn_reference_suite.py \
            tests/test_shn_provider_workflow.py \
            tests/test_shn_dtr_questionnaire_response.py
      - name: Prepare public synthetic ZIP reference fixture for MVP-0
        run: |
          mkdir -p apps/mvp0/ref
          cp apps/mvp0/tests/fixtures/zip_reference_smoke.csv apps/mvp0/ref/address.csv
      - name: M-004 eligibility, payer, cross-format, and DiScO regression
        run: |
          cd apps/mvp0
          python -m pytest -q \
            tests/test_core_generator_offline_sdoh.py \
            tests/test_coverage*.py \
            tests/test_fhir_coverage_conversion.py \
            tests/test_fhir_eligibility_r4.py \
            tests/test_fhir_pipeline_integration.py \
            tests/test_fhir_x12_semantic_equivalence.py \
            tests/test_gt1_employer_mvp.py \
            tests/test_payer*.py \
            tests/test_reality_separation.py \
            tests/test_x12_*.py \
            tests/test_disco_inferno.py \
            tests/test_disco_inferno_offline_sdoh.py \
            tests/test_disco_inferno_process_control.py
      - name: Checkout pinned PIQITT converter for M-003 deferred path
        uses: actions/checkout@v4
        with:
          repository: natosit-dev/piqitt
          ref: a40300e4950d73ed192a2112cf516b4ec46a184b
          path: piqitt
      - name: PIQI conversion, discovery and mutation integration
        env:
          PIQITT_REPO: ${{ github.workspace }}/piqitt
        run: |
          cd apps/mvp0
          python -m pytest -q \
            tests/test_piqitt_bridge_discovery.py \
            tests/test_connectathon_piqitt_integration.py
      - name: MVP-0 reference CLI import smoke
        run: |
          cd apps/mvp0
          python -m connectathon.shn_provider.reference_run --help
