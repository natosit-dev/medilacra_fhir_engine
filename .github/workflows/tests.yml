name: Unified Medilacra tests

on:
  push:
    branches: [main, feat/unified-medilacra]
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Engine and Workbench dependencies
        run: python -m pip install -e ".[dev]" -r apps/workbench/requirements.txt
      - name: Engine source integrity and unified navigation tests
        run: python -m pytest -q tests
      - name: Workbench regression tests
        run: |
          cd apps/workbench
          python -m pytest -q tests
      - name: MVP-0 DTR version compatibility and reference regression
        run: |
          cd apps/mvp0
          python -m pytest -q \
            tests/test_shn_dtr_parameter_versions.py \
            tests/test_shn_reference_suite.py \
            tests/test_shn_provider_workflow.py \
            tests/test_shn_dtr_questionnaire_response.py
      - name: MVP-0 reference CLI import smoke
        run: |
          cd apps/mvp0
          python -m connectathon.shn_provider.reference_run --help
