name: Medilacra AWS MVP deployment wrapper

on:
  push:
    paths:
      - 'deploy/**'
      - 'tests/test_aws_instance_provenance.py'
      - 'apps/workbench/toolbench/logging.py'
      - 'apps/mvp0/connectathon/shn_provider/run_logging.py'
      - '.github/workflows/aws-deployment-mvp-tests.yml'
  pull_request:
    paths:
      - 'deploy/**'
      - 'tests/test_aws_instance_provenance.py'
      - 'apps/workbench/toolbench/logging.py'
      - 'apps/mvp0/connectathon/shn_provider/run_logging.py'
      - '.github/workflows/aws-deployment-mvp-tests.yml'

jobs:
  wrapper-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Check deployment syntax
        run: python -m compileall -q deploy
      - name: Offline deployment wrapper tests
        run: python -m unittest discover -s deploy/tests -v
      - name: Install Engine and Workbench dependencies
        run: python -m pip install -e ".[dev]" -r apps/workbench/requirements.txt
      - name: Unified Engine/navigation regression tests
        run: python -m pytest -q tests
      - name: Workbench regression tests
        run: |
          cd apps/workbench
          python -m pytest -q tests
      - name: Selected MVP-0 reference regressions
        run: |
          cd apps/mvp0
          python -m pytest -q \
            tests/test_shn_dtr_parameter_versions.py \
            tests/test_shn_reference_suite.py \
            tests/test_shn_provider_workflow.py \
            tests/test_shn_dtr_questionnaire_response.py
      - name: MVP-0 CLI import smoke
        run: |
          cd apps/mvp0
          python -m connectathon.shn_provider.reference_run --help
